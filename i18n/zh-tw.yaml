productEvermusicSubtitle: "雲端音樂播放器，支援離線模式、音訊等化器、交叉淡入淡出、無縫播放、播放清單、音樂庫、檔案管理員。"
productFlacboxTag: "100 萬次下載"
productFlacboxSubtitle: "適用於 iPhone 和 Mac 的 Hi-Res 音訊播放器。以無損音訊格式聆聽音樂：flac、alac、ape、wv、dsd 等。啟用進階音訊輸出設定。"
