productEverdiskTag: "新品"
productEverdiskSubtitle: "把你的 iPhone 或 iPad 變成無線硬碟。透過 DLNA、HTTP、WebDAV、SMB 和 FTP 與任何裝置共享檔案、相片、影片和音樂。可掛載為網路磁碟機，並選用 SMB 加密。可串流到電視，並連線到其他伺服器。"

