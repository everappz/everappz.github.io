productEvervideoTag: "Новинка"
productEvervideoSubtitle: "Відтворюйте 360° відео, дивіться з субтитрами, використовуйте відеоеквалайзер, організовуйте медіа за допомогою плейлистів, завантажуйте відео для офлайн-перегляду та транслюйте з iCloud."
productEvermusicTag: "11 мільйонів завантажень"
productEvermusicSubtitle: "Хмарний музичний плеєр з офлайн-режимом, аудіоеквалайзером, кросфейдом, безперервним відтворенням, плейлистами, музичною бібліотекою, файловим менеджером."
productFlacboxTag: "1 мільйон завантажень"
productFlacboxSubtitle: "Hi-Res аудіоплеєр для iPhone та Mac. Слухайте музику у форматах без втрат: flac, alac, ape, wv, dsd та інші. Увімкніть розширені налаштування аудіовиходу."
productEvertagSubtitle: "Редактор музичних тегів з автоматичним виправленням та пакетним режимом. Знаходьте відсутні метадані, редагуйте обкладинки альбомів. Редагуйте ID3 / FLAC / APE. Підтримується понад 120 тегів."
productEverdiskTag: "Новинка"
productEverdiskSubtitle: "Перетворіть свій iPhone або iPad на бездротовий диск. Діліться файлами, фото, відео та музикою з будь-яким пристроєм через DLNA, HTTP, WebDAV, SMB і FTP. Транслюйте на телевізори, підключайте як мережевий диск з опціональним шифруванням SMB і з'єднуйтеся з іншими серверами."

