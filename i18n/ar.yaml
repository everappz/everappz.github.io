productEvervideoTag: "جديد"
productEvervideoSubtitle: "شغّل فيديوهات 360°، شاهد مع ترجمات، استخدم معادل الفيديو، نظّم وسائطك بقوائم التشغيل، حمّل الفيديوهات للمشاهدة بدون إنترنت، وابث من iCloud."
productEvermusicTag: "١١ مليون تحميل"
productEvermusicSubtitle: "مشغّل موسيقى سحابي مع وضع عدم الاتصال، معادل صوتي، انتقال سلس بين المسارات، تشغيل بدون فجوات، قوائم تشغيل، مكتبة موسيقية، مدير ملفات."
productFlacboxTag: "مليون تحميل"
productFlacboxSubtitle: "مشغّل صوت عالي الدقة لأجهزة iPhone وMac. استمع لموسيقاك بصيغ صوتية بدون فقدان: flac، alac، ape، wv، dsd والمزيد. فعّل إعدادات الإخراج الصوتي المتقدمة."
productEvertagSubtitle: "محرر علامات الموسيقى مع التصحيح التلقائي ووضع الدفعات. ابحث عن البيانات الوصفية المفقودة، حرّر أغلفة الألبومات. حرّر ID3 / FLAC / APE. أكثر من 120 علامة مدعومة."
productEverdiskTag: "جديد"
productEverdiskSubtitle: "حوّل جهاز iPhone أو iPad إلى قرص لاسلكي. شارك الملفات والصور والفيديوهات والموسيقى مع أي جهاز عبر DLNA وHTTP وWebDAV وSMB وFTP. البث إلى أجهزة التلفزيون، والتوصيل كقرص شبكي مع تشفير SMB اختياري، والاتصال بخوادم أخرى."

