productEvervideoTag: "Новинка"
productEvervideoSubtitle: "Воспроизводите видео 360°, смотрите с субтитрами, используйте видеоэквалайзер, организуйте медиа с помощью плейлистов, скачивайте видео для офлайн-просмотра и транслируйте из iCloud."
productEvermusicTag: "11 миллионов загрузок"
productEvermusicSubtitle: "Облачный музыкальный плеер с офлайн-режимом, аудиоэквалайзером, кроссфейдом, непрерывным воспроизведением, плейлистами, музыкальной библиотекой, файловым менеджером."
productFlacboxTag: "1 миллион загрузок"
productFlacboxSubtitle: "Hi-Res аудиоплеер для iPhone и Mac. Слушайте музыку в форматах без потерь: flac, alac, ape, wv, dsd и других. Включите расширенные настройки аудиовыхода."
productEvertagSubtitle: "Редактор музыкальных тегов с автоматической коррекцией и пакетным режимом. Находите недостающие метаданные, редактируйте обложки альбомов. Редактируйте ID3 / FLAC / APE. Поддержка более 120 тегов."
productEverdiskTag: "Новинка"
productEverdiskSubtitle: "Превратите свой iPhone или iPad в беспроводной диск. Делитесь файлами, фото, видео и музыкой с любым устройством по DLNA, HTTP, WebDAV, SMB и FTP. Транслируйте на телевизоры, подключайте как сетевой диск с опциональным шифрованием SMB и подключайтесь к другим серверам."

