productEvervideoTag: "Nou"
productEvervideoSubtitle: "Redați videoclipuri 360°, vizionați cu subtitrări, utilizați un egalizator video, organizați-vă media cu playlisturi, descărcați videoclipuri pentru utilizare offline și transmiteți din iCloud."
productEvermusicTag: "11 milioane de descărcări"
productEvermusicSubtitle: "Player de muzică în cloud cu mod offline, egalizator audio, crossfade, redare fără pauze, playlisturi, bibliotecă muzicală, manager de fișiere."
productFlacboxTag: "1 milion de descărcări"
productFlacboxSubtitle: "Player audio Hi-Res pentru iPhone și Mac. Ascultați muzica în formate audio fără pierderi: flac, alac, ape, wv, dsd și altele. Activați setările avansate de ieșire audio."
