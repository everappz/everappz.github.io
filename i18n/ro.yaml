productEverdiskTag: "Nou"
productEverdiskSubtitle: "Transformă-ți iPhone-ul sau iPad-ul într-o unitate wireless. Partajează fișiere, fotografii, videoclipuri și muzică cu orice dispozitiv prin DLNA, HTTP, WebDAV, SMB și FTP. Transmite către televizoare, montează-l ca unitate de rețea cu criptare SMB opțională și conectează-te la alte servere."

