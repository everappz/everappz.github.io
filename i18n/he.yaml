productEvervideoTag: "חדש"
productEvervideoSubtitle: "נגנו סרטוני 360°, צפו עם כתוביות, השתמשו באקולייזר וידאו, ארגנו את המדיה שלכם עם פלייליסטים, הורידו סרטונים לשימוש לא מקוון והזרימו מ-iCloud."
productEvermusicTag: "11 מיליון הורדות"
productEvermusicSubtitle: "נגן מוזיקה בענן עם מצב לא מקוון, אקולייזר שמע, קרוספייד, השמעה רציפה, פלייליסטים, ספריית מוזיקה, מנהל קבצים."
productFlacboxTag: "מיליון הורדות"
productFlacboxSubtitle: "נגן שמע Hi-Res לאייפון ולמק. האזינו למוזיקה שלכם בפורמטים ללא אובדן: flac, alac, ape, wv, dsd ועוד. הפעילו הגדרות פלט שמע מתקדמות."
productEvertagSubtitle: "עורך תגיות מוזיקה עם תיקון אוטומטי ומצב אצווה. מצאו מטאדאטה חסרה, ערכו עטיפות אלבומים. ערכו ID3 / FLAC / APE. תמיכה ביותר מ-120 תגיות."
productEverdiskTag: "חדש"
productEverdiskSubtitle: "הפכו את ה-iPhone או ה-iPad שלכם לכונן אלחוטי. שתפו קבצים, תמונות, סרטונים ומוזיקה עם כל מכשיר דרך DLNA, HTTP, WebDAV, SMB ו-FTP. הזרימו לטלוויזיות, חברו ככונן רשת עם הצפנת SMB אופציונלית והתחברו לשרתים אחרים."

