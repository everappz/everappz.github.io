productEvervideoTag: "Ny"
productEvervideoSubtitle: "Spill av 360°-videoer, se med undertekster, bruk en videoequalizer, organiser mediene dine med spillelister, last ned videoer for offline bruk og strøm fra iCloud."
productEvermusicTag: "11 millioner nedlastinger"
productEvermusicSubtitle: "Skymusikkspiller med frakoblet modus, lydequalizer, kryssfading, gapløs avspilling, spillelister, musikkbibliotek, filbehandler."
productFlacboxTag: "1 million nedlastinger"
productFlacboxSubtitle: "Hi-Res lydspiller for iPhone og Mac. Lytt til musikken din i tapsfrie lydformater: flac, alac, ape, wv, dsd og mer. Aktiver avanserte lydutgangsinnstillinger."
productEvertagSubtitle: "Musikktaggredigerer med automatisk korrigering og batchmodus. Finn manglende metadata, rediger albumomslag. Rediger ID3 / FLAC / APE. Mer enn 120 tagger støttes."
productEverdiskTag: "Ny"
productEverdiskSubtitle: "Gjør iPhone eller iPad til en trådløs stasjon. Del filer, bilder, videoer og musikk med hvilken som helst enhet via DLNA, HTTP, WebDAV, SMB og FTP. Strøm til TV-er, koble til som nettverksstasjon med valgfri SMB-kryptering, og koble til andre servere."

