productEvervideoTag: "Novinka"
productEvervideoSubtitle: "Přehrávejte 360° videa, sledujte s titulky, používejte video ekvalizér, organizujte média pomocí playlistů, stahujte videa pro offline sledování a streamujte z iCloudu."
productEvermusicTag: "11 milionů stažení"
productEvermusicSubtitle: "Cloudový hudební přehrávač s offline režimem, audio ekvalizérem, crossfade, plynulým přehráváním, playlisty, hudební knihovnou, správcem souborů."
productFlacboxTag: "1 milion stažení"
productFlacboxSubtitle: "Hi-Res audio přehrávač pro iPhone a Mac. Poslouchejte svou hudbu v bezztrátových audio formátech: flac, alac, ape, wv, dsd a dalších. Aktivujte pokročilá nastavení audio výstupu."
productEvertagSubtitle: "Editor hudebních tagů s automatickou korekcí a dávkovým režimem. Najděte chybějící metadata, upravte obaly alb. Editujte ID3 / FLAC / APE. Podporováno více než 120 tagů."
productEverdiskTag: "Novinka"
productEverdiskSubtitle: "Proměňte svůj iPhone nebo iPad v bezdrátový disk. Sdílejte soubory, fotky, videa a hudbu s libovolným zařízením přes DLNA, HTTP, WebDAV, SMB a FTP. Vysílejte do televizorů, připojte jej jako síťový disk s volitelným šifrováním SMB a připojujte se k dalším serverům."

