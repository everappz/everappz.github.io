productEvervideoTag: "신규"
productEvervideoSubtitle: "360° 비디오 재생, 자막과 함께 시청, 비디오 이퀄라이저 사용, 플레이리스트로 미디어 정리, 오프라인용 비디오 다운로드, iCloud에서 스트리밍."
productEvermusicTag: "1,100만 다운로드"
productEvermusicSubtitle: "오프라인 모드, 오디오 이퀄라이저, 크로스페이드, 갭리스 재생, 플레이리스트, 음악 라이브러리, 파일 관리자를 갖춘 클라우드 뮤직 플레이어."
productFlacboxTag: "100만 다운로드"
productFlacboxSubtitle: "iPhone 및 Mac용 하이레졸루션 오디오 플레이어. 무손실 오디오 포맷(flac, alac, ape, wv, dsd 등)으로 음악을 감상하세요. 고급 오디오 출력 설정을 활성화할 수 있습니다."
productEvertagSubtitle: "자동 수정 및 일괄 모드를 갖춘 음악 태그 편집기. 누락된 메타데이터 검색, 앨범 커버 편집. ID3 / FLAC / APE 편집. 120개 이상의 태그 지원."
productEverdiskTag: "신규"
productEverdiskSubtitle: "iPhone 또는 iPad를 무선 드라이브로 바꿔 보세요. DLNA, HTTP, WebDAV, SMB, FTP를 통해 모든 기기와 파일, 사진, 동영상, 음악을 공유하세요. TV로 스트리밍하고 선택적 SMB 암호화로 네트워크 드라이브로 연결하며 다른 서버에도 연결할 수 있습니다."

