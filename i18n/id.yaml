productEvervideoTag: "Baru"
productEvervideoSubtitle: "Putar video 360°, tonton dengan subtitle, gunakan equalizer video, atur media Anda dengan playlist, unduh video untuk penggunaan offline, dan streaming dari iCloud."
productEvermusicTag: "11 Juta Unduhan"
productEvermusicSubtitle: "Pemutar musik cloud dengan mode offline, equalizer audio, crossfade, pemutaran tanpa jeda, playlist, perpustakaan musik, pengelola file."
productFlacboxTag: "1 Juta Unduhan"
productFlacboxSubtitle: "Pemutar audio Hi-Res untuk iPhone dan Mac. Dengarkan musik Anda dalam format audio lossless: flac, alac, ape, wv, dsd dan lainnya. Aktifkan pengaturan output audio lanjutan."
productEvertagSubtitle: "Editor tag musik dengan koreksi otomatis dan mode batch. Temukan metadata yang hilang, edit sampul album. Edit ID3 / FLAC / APE. Lebih dari 120 tag didukung."
productEverdiskTag: "Baru"
productEverdiskSubtitle: "Ubah iPhone atau iPad Anda menjadi drive nirkabel. Bagikan file, foto, video, dan musik dengan perangkat apa pun melalui DLNA, HTTP, WebDAV, SMB, dan FTP. Streaming ke TV, pasang sebagai drive jaringan dengan enkripsi SMB opsional, dan sambungkan ke server lain."

