productEvervideoTag: "Nou"
productEvervideoSubtitle: "Reprodueix vídeos de 360°, mira amb subtítols, utilitza un equalitzador de vídeo, organitza els teus mitjans amb llistes de reproducció, descarrega vídeos per veure'ls fora de línia i transmet des d'iCloud."
productEvermusicTag: "11 milions de descàrregues"
productEvermusicSubtitle: "Reproductor de música al núvol amb mode fora de línia, equalitzador d'àudio, crossfade, reproducció sense interrupcions, llistes de reproducció, biblioteca musical, gestor de fitxers."
productFlacboxTag: "1 milió de descàrregues"
productFlacboxSubtitle: "Reproductor d'àudio d'alta resolució per a iPhone i Mac. Escolta la teva música en formats d'àudio sense pèrdua: flac, alac, ape, wv, dsd i més. Activa la configuració avançada de sortida d'àudio."
productEvertagSubtitle: "Editor d'etiquetes musicals amb correcció automàtica i mode per lots. Troba metadades que falten, edita portades d'àlbums. Edita ID3 / FLAC / APE. Més de 120 etiquetes compatibles."
productEverdiskTag: "Nou"
productEverdiskSubtitle: "Converteix el teu iPhone o iPad en una unitat sense fil. Comparteix fitxers, fotos, vídeos i música amb qualsevol dispositiu mitjançant DLNA, HTTP, WebDAV, SMB i FTP. Transmet a televisors, munta'l com a unitat de xarxa amb xifratge SMB opcional i connecta't a altres servidors."

