productEvervideoTag: "Novinka"
productEvervideoSubtitle: "Prehrávajte 360° videá, sledujte s titulkami, používajte video ekvalizér, organizujte médiá pomocou playlistov, sťahujte videá na offline použitie a streamujte z iCloud."
productEvermusicTag: "11 miliónov stiahnutí"
productEvermusicSubtitle: "Cloudový hudobný prehrávač s offline režimom, audio ekvalizérom, crossfade, bezmedzerovým prehrávaním, playlistami, hudobnou knižnicou, správcom súborov."
productFlacboxTag: "1 milión stiahnutí"
productFlacboxSubtitle: "Hi-Res audio prehrávač pre iPhone a Mac. Počúvajte hudbu v bezstratových audio formátoch: flac, alac, ape, wv, dsd a ďalšie. Zapnite pokročilé nastavenia audio výstupu."
productEvertagSubtitle: "Editor hudobných tagov s automatickou korekciou a dávkovým režimom. Nájdite chýbajúce metadáta, upravte obaly albumov. Upravte ID3 / FLAC / APE. Podpora viac ako 120 tagov."
productEverdiskTag: "Novinka"
productEverdiskSubtitle: "Premeňte svoj iPhone alebo iPad na bezdrôtový disk. Zdieľajte súbory, fotky, videá a hudbu s ľubovoľným zariadením cez DLNA, HTTP, WebDAV, SMB a FTP. Vysielajte do televízorov, pripojte ho ako sieťový disk s voliteľným šifrovaním SMB a pripájajte sa k ďalším serverom."

