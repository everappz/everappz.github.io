productEvervideoTag: "Baharu"
productEvervideoSubtitle: "Main video 360°, tonton dengan sari kata, gunakan penyama video, susun media anda dengan senarai main, muat turun video untuk kegunaan luar talian, dan strim dari iCloud."
productEvermusicTag: "11 Juta Muat Turun"
productEvermusicSubtitle: "Pemain muzik awan dengan mod luar talian, penyama audio, crossfade, main balik tanpa jeda, senarai main, pustaka muzik, pengurus fail."
productFlacboxTag: "1 Juta Muat Turun"
productFlacboxSubtitle: "Pemain audio Hi-Res untuk iPhone dan Mac. Dengar muzik anda dalam format audio lossless: flac, alac, ape, wv, dsd dan banyak lagi. Aktifkan tetapan output audio lanjutan."
productEvertagSubtitle: "Editor tag muzik dengan pembetulan automatik dan mod kelompok. Cari metadata yang hilang, edit kulit album. Edit ID3 / FLAC / APE. Lebih daripada 120 tag disokong."
productEverdiskTag: "Baharu"
productEverdiskSubtitle: "Tukar iPhone atau iPad anda menjadi pemacu tanpa wayar. Kongsi fail, foto, video dan muzik dengan mana-mana peranti melalui DLNA, HTTP, WebDAV, SMB dan FTP. Strim ke TV, lekapkan sebagai pemacu rangkaian dengan penyulitan SMB pilihan, dan sambung ke pelayan lain."

