productEvervideoTag: "नया"
productEvervideoSubtitle: "360° वीडियो चलाएं, सबटाइटल के साथ देखें, वीडियो इक्वलाइज़र का उपयोग करें, प्लेलिस्ट से अपनी मीडिया व्यवस्थित करें, ऑफ़लाइन उपयोग के लिए वीडियो डाउनलोड करें और iCloud से स्ट्रीम करें।"
productEvermusicTag: "1.1 करोड़ डाउनलोड"
productEvermusicSubtitle: "ऑफ़लाइन मोड, ऑडियो इक्वलाइज़र, क्रॉसफ़ेड, गैपलेस प्लेबैक, प्लेलिस्ट, म्यूज़िक लाइब्रेरी, फ़ाइल मैनेजर के साथ क्लाउड म्यूज़िक प्लेयर।"
productFlacboxTag: "10 लाख डाउनलोड"
productFlacboxSubtitle: "iPhone और Mac के लिए Hi-Res ऑडियो प्लेयर। लॉसलेस ऑडियो फ़ॉर्मेट में अपना संगीत सुनें: flac, alac, ape, wv, dsd और अधिक। उन्नत ऑडियो आउटपुट सेटिंग्स सक्षम करें।"
productEvertagSubtitle: "स्वचालित सुधार और बैच मोड के साथ म्यूज़िक टैग एडिटर। गायब मेटाडेटा खोजें, एल्बम कवर संपादित करें। ID3 / FLAC / APE संपादित करें। 120 से अधिक टैग समर्थित।"
productEverdiskTag: "नया"
productEverdiskSubtitle: "अपने iPhone या iPad को वायरलेस ड्राइव में बदलें। DLNA, HTTP, WebDAV, SMB और FTP के ज़रिए किसी भी डिवाइस के साथ फ़ाइलें, फ़ोटो, वीडियो और संगीत साझा करें। टीवी पर स्ट्रीम करें, वैकल्पिक SMB एन्क्रिप्शन के साथ नेटवर्क ड्राइव के रूप में माउंट करें और अन्य सर्वर से कनेक्ट करें।"

